<div class="quiz-page">
  <div class="quiz-card" *ngIf="!loading(); else loadingTpl">
    <div class="top-row">
      <span class="level-badge">{{ question()?.level }}</span>
      <span class="score">{{ score() }} / {{ total() }}</span>
    </div>

    <p class="eyebrow">Definition</p>

    <h1 class="thai-word">{{ question()?.thai?.join(', ') }}</h1>

    <p class="hint">Choose the Food &amp; Drink term that matches this definition.</p>

    <div class="choice-list">
      <button
        *ngFor="let choice of question()?.choices; let index = index"
        type="button"
        class="choice-button"
        [class.selected]="selectedAnswer() === choice"
        [class.correct]="state() !== 'idle' && choice === correctAnswer()"
        [class.wrong]="state() === 'wrong' && selectedAnswer() === choice"
        [disabled]="state() !== 'idle'"
        (click)="submitAnswer(choice)"
      >
        <span>{{ ['A', 'B', 'C', 'D', 'E'][index] }}</span>{{ choice }}
      </button>
    </div>

    <div class="feedback" *ngIf="state() !== 'idle'">
      <ng-container *ngIf="state() === 'correct'">
        <span class="feedback-icon">✓</span> Correct!
      </ng-container>
      <ng-container *ngIf="state() === 'wrong'">
        <span class="feedback-icon">✕</span> The answer is "{{ correctAnswer() }}"
      </ng-container>
    </div>

    <button class="submit-bar next" *ngIf="state() !== 'idle'" (click)="loadNextQuestion()">
      Next question →
    </button>
  </div>

  <ng-template #loadingTpl>
    <div class="quiz-card loading-card">Loading vocabulary...</div>
  </ng-template>
</div>
